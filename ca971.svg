<svg width="1280" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="40%" style="stop-color:#161b22"/>
      <stop offset="70%" style="stop-color:#1a1b4b"/>
      <stop offset="100%" style="stop-color:#2d1b69"/>
    </linearGradient>
    <!-- Accent gradient -->
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff"/>
      <stop offset="50%" style="stop-color:#bc8cff"/>
      <stop offset="100%" style="stop-color:#f778ba"/>
    </linearGradient>
    <!-- Glow effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="400" fill="url(#bg)"/>

  <!-- Grid pattern subtle -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.3" opacity="0.05"/>
  </pattern>
  <rect width="1280" height="400" fill="url(#grid)"/>

  <!-- Decorative orbs -->
  <circle cx="1100" cy="60" r="80" fill="#58a6ff" opacity="0.06"/>
  <circle cx="1200" cy="180" r="120" fill="#bc8cff" opacity="0.05"/>
  <circle cx="1050" cy="160" r="50" fill="#f778ba" opacity="0.06"/>
  <circle cx="950" cy="40" r="30" fill="#58a6ff" opacity="0.08"/>
  <circle cx="1250" cy="350" r="40" fill="#7ee787" opacity="0.06"/>

  <!-- Accent line top -->
  <rect x="80" y="60" width="4" height="280" rx="2" fill="url(#accent)" opacity="0.6"/>

  <!-- Neovim icon -->
  <g transform="translate(110, 85)" opacity="0.9">
    <rect width="36" height="36" rx="8" fill="#57A143" opacity="0.2"/>
    <text x="18" y="26" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#57A143" text-anchor="middle" font-weight="700">N</text>
  </g>

  <!-- Name -->
  <text x="160" y="115" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-weight="700" font-size="48" fill="#ffffff" filter="url(#glow)">
    Christian ACHILLE
  </text>

  <!-- Title -->
  <text x="110" y="165" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-weight="400" font-size="24" fill="#8b949e">
    Full-Stack Developer  ·  Software Engineer
  </text>

  <!-- Separator -->
  <rect x="110" y="185" width="280" height="2" rx="1" fill="url(#accent)" opacity="0.4"/>

  <!-- Tech stack with colored icons -->
  <!-- Neovim -->
  <rect x="110" y="210" width="105" height="32" rx="16" fill="#57A143" opacity="0.15"/>
  <circle cx="128" cy="226" r="6" fill="#57A143"/>
  <text x="140" y="232" font-family="Segoe UI, Arial, sans-serif" font-weight="500" font-size="15" fill="#57A143">Neovim</text>

  <!-- Linux -->
  <rect x="225" y="210" width="90" height="32" rx="16" fill="#FCC624" opacity="0.12"/>
  <circle cx="243" cy="226" r="6" fill="#FCC624"/>
  <text x="255" y="232" font-family="Segoe UI, Arial, sans-serif" font-weight="500" font-size="15" fill="#FCC624">Linux</text>

  <!-- Cloud -->
  <rect x="325" y="210" width="90" height="32" rx="16" fill="#58a6ff" opacity="0.15"/>
  <circle cx="343" cy="226" r="6" fill="#58a6ff"/>
  <text x="355" y="232" font-family="Segoe UI, Arial, sans-serif" font-weight="500" font-size="15" fill="#58a6ff">Cloud</text>

  <!-- Proxmox -->
  <rect x="425" y="210" width="115" height="32" rx="16" fill="#E57000" opacity="0.15"/>
  <circle cx="443" cy="226" r="6" fill="#E57000"/>
  <text x="455" y="232" font-family="Segoe UI, Arial, sans-serif" font-weight="500" font-size="15" fill="#E57000">Proxmox</text>

  <!-- AI -->
  <rect x="550" y="210" width="65" height="32" rx="16" fill="#bc8cff" opacity="0.15"/>
  <circle cx="568" cy="226" r="6" fill="#bc8cff"/>
  <text x="580" y="232" font-family="Segoe UI, Arial, sans-serif" font-weight="500" font-size="15" fill="#bc8cff">AI</text>

  <!-- Data -->
  <rect x="625" y="210" width="80" height="32" rx="16" fill="#f778ba" opacity="0.15"/>
  <circle cx="643" cy="226" r="6" fill="#f778ba"/>
  <text x="655" y="232" font-family="Segoe UI, Arial, sans-serif" font-weight="500" font-size="15" fill="#f778ba">Data</text>

  <!-- macOS -->
  <rect x="715" y="210" width="100" height="32" rx="16" fill="#ffffff" opacity="0.1"/>
  <circle cx="733" cy="226" r="6" fill="#ffffff" opacity="0.7"/>
  <text x="745" y="232" font-family="Segoe UI, Arial, sans-serif" font-weight="500" font-size="15" fill="#ffffff" opacity="0.7">macOS</text>

  <!-- Featured project box -->
  <rect x="110" y="270" width="440" height="55" rx="12" fill="#ffffff" opacity="0.04" stroke="#58a6ff" stroke-width="1" opacity="0.2"/>
  <text x="130" y="295" font-family="Segoe UI, Arial, sans-serif" font-weight="400" font-size="13" fill="#8b949e">Featured Project</text>
  <text x="130" y="315" font-family="Segoe UI, Arial, sans-serif" font-weight="700" font-size="16" fill="#58a6ff">NvimEnterprise</text>
  <text x="290" y="315" font-family="Segoe UI, Arial, sans-serif" font-weight="400" font-size="14" fill="#8b949e">Enterprise-grade Neovim framework</text>

  <!-- Handle -->
  <text x="110" y="365" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-weight="400" font-size="16" fill="#6e7681">
    @ca971  ·  github.com/ca971
  </text>

  <!-- Open to collaborate badge -->
  <rect x="1030" y="345" width="190" height="32" rx="16" fill="#238636" opacity="0.8"/>
  <circle cx="1055" cy="361" r="5" fill="#7ee787"/>
  <text x="1125" y="367" font-family="Segoe UI, Arial, sans-serif" font-weight="600" font-size="14" fill="#ffffff" text-anchor="middle">
    Open to collaborate
  </text>

  <!-- Star count badge -->
  <rect x="1030" y="305" width="190" height="32" rx="16" fill="#ffffff" opacity="0.06" stroke="#58a6ff" stroke-width="1" stroke-opacity="0.3"/>
  <text x="1125" y="327" font-family="Segoe UI, Arial, sans-serif" font-weight="500" font-size="13" fill="#58a6ff" text-anchor="middle">
    ⭐ Star NvimEnterprise
  </text>

  <!-- Decorative bottom accent -->
  <rect x="0" y="395" width="1280" height="5" fill="url(#accent)" opacity="0.6"/>
</svg>
